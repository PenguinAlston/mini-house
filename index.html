<style>
body { margin:0; overflow:hidden; background:#f5f5f5; font-family: Inter, "PingFang SC", system-ui, sans-serif; color:#46372b; }
#panel { position:absolute; top:20px; left:20px; width:238px; box-sizing:border-box; background:rgba(255,250,242,.94); backdrop-filter:blur(16px); padding:18px; border:1px solid rgba(139,99,62,.16); border-radius:16px; box-shadow:0 12px 40px rgba(76,48,25,.13); z-index:100; }
#panel b { display:block; font-size:17px; letter-spacing:.04em; color:#61432e; }
#panel .eyebrow { color:#b77a4c; font-size:10px; letter-spacing:.18em; margin-bottom:5px; }
#panel input[type=range] { accent-color:#bd7950; width:100% !important; }
#panel button { font:inherit; font-size:12px; }

#parts { position:absolute; right:20px; top:20px; z-index:100; width:190px; padding:14px; border-radius:15px; background:rgba(255,250,242,.9); border:1px solid rgba(139,99,62,.14); box-shadow:0 10px 32px rgba(76,48,25,.1); backdrop-filter:blur(14px); }
#parts strong { font-size:12px; letter-spacing:.08em; color:#77543a; display:block; margin:2px 4px 9px; }
.part-btn { display:flex; width:100%; align-items:center; justify-content:space-between; gap:8px; padding:8px 9px; margin:3px 0; border:0; border-radius:8px; background:transparent; color:#6d5948; text-align:left; cursor:pointer; }
.part-btn:hover,.part-btn.active { background:#f0e1d0; color:#8d5638; }
.part-btn small { color:#b69b80; font-size:10px; }
@media(max-width:700px){ #panel{top:10px;left:10px;width:205px;padding:13px} #parts{right:10px;top:auto;bottom:10px;width:160px;max-height:35vh;overflow:auto;padding:10px} }
#buildGuide { position:absolute; left:20px; bottom:18px; z-index:100; width:270px; max-height:34vh; overflow:auto; box-sizing:border-box; padding:14px 16px; border-radius:14px; background:rgba(255,250,242,.94); border:1px solid rgba(139,99,62,.16); box-shadow:0 10px 30px rgba(76,48,25,.12); backdrop-filter:blur(14px); }
#buildGuide strong { display:block; color:#77543a; font-size:12px; letter-spacing:.08em; margin-bottom:8px; }
#buildGuide .guideMeta { color:#9b8067; font-size:10px; line-height:1.5; }

#buildGuide .guideBody { color:#6d5948; font-size:11px; line-height:1.65; white-space:pre-line; }
#buildGuide .guideNav { display:flex; gap:6px; margin-top:8px; }
#buildGuide button { margin:0; padding:6px 9px; font-size:11px; background:#8d6848; }
@media(max-width:700px){ #buildGuide{left:10px;bottom:10px;width:calc(100vw - 190px);max-height:25vh;padding:10px} #buildGuide .guideBody{font-size:10px} }
button { margin:4px; padding:8px 14px; border:none; background:#ff6b35; color:white; border-radius:6px; cursor:pointer; }
button:hover { background:#e55a2b; }
.label { background:rgba(255,255,255,0.95); color:#c0392b; font-size:11px; padding:2px 5px; border-radius:3px; white-space:pre; text-align:center; border:1px solid #eee; box-shadow:0 1px 4px rgba(0,0,0,0.25); pointer-events:none; }
</style>
</head>
<body>
<div id="panel">
  <div class="eyebrow">MINIATURE · ATELIER</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ---------- 基础 ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6efe2);
scene.fog = new THREE.Fog(0xf6efe2, 160, 340);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 600);
camera.position.set(42, 28, 58);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, labelRenderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 11, 0);
controls.maxPolarAngle = 1.52;

// 根据视口比例自适应相机距离，保证窄屏也能看全整屋
function fitCamera() {
  const aspect = innerWidth/innerHeight;
  const base = new THREE.Vector3(42, 28, 58);
  const hFov = 2*Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) * aspect);
  const need = 27/Math.tan(hFov/2);          // 覆盖半宽 27 的距离
  const k = Math.max(1, need*1.1/base.length());
  camera.position.copy(base).multiplyScalar(k);
}
fitCamera();

/* ---------- 灯光 ---------- */
scene.add(new THREE.HemisphereLight(0xfff3e0, 0xcbb694, 0.55));
scene.add(new THREE.AmbientLight(0xffffff, 0.18));

const sun = new THREE.DirectionalLight(0xffe8c8, 1.9);
sun.position.set(28, 46, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -48; sun.shadow.camera.right = 48;
sun.shadow.camera.top = 48; sun.shadow.camera.bottom = -48;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 140;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);

const fill = new THREE.PointLight(0xffd9b0, 14, 60, 2);
fill.position.set(0, 24, 24);
scene.add(fill);

/* ---------- 材质 ---------- */
// 程序化木纹贴图
function woodTexture(base, grain, rep=[2,1]) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,256,256);
  for (let i=0;i<48;i++){
    g.strokeStyle = grain; g.globalAlpha = 0.06+Math.random()*0.12;
    g.lineWidth = 0.5+Math.random()*1.6;
    const y = Math.random()*256;
    g.beginPath(); g.moveTo(0, y);
    for (let x=0;x<=256;x+=16) g.lineTo(x, y + Math.sin(x*0.05+i)*2 + (Math.random()-0.5)*2);
    g.stroke();
  }
  g.globalAlpha = 0.05;
  for (let i=0;i<260;i++){ g.fillStyle = Math.random()>0.5 ? grain : '#ffffff'; g.fillRect(Math.random()*256, Math.random()*256, 1.5, 1.5); }
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.repeat.set(rep[0], rep[1]);
  return t;
}

const M = {
  ply:     new THREE.MeshStandardMaterial({map: woodTexture('#d9c29b','#8a6a44'), roughness:0.82}),
  plyDark: new THREE.MeshStandardMaterial({map: woodTexture('#c9a878','#7a5a34',[3,1]), roughness:0.8}),
  frame:   new THREE.MeshStandardMaterial({color:0x7d4f28, roughness:0.72}),
  shelf:   new THREE.MeshStandardMaterial({color:0x9c6a3e, roughness:0.75}),
  cab:     new THREE.MeshStandardMaterial({map: woodTexture('#b58a58','#6e4a26'), roughness:0.75}),
  roofSlab:new THREE.MeshStandardMaterial({color:0xa88f5e, roughness:1}),
  cushion: new THREE.MeshStandardMaterial({color:0xb01445, roughness:1}),
  accent:  new THREE.MeshStandardMaterial({color:0xa63a2a, roughness:0.7}),
  yellow:  new THREE.MeshStandardMaterial({color:0xe2b34a, roughness:0.6}),
  orange:  new THREE.MeshStandardMaterial({color:0xd98f3a, roughness:0.6}),
  potY:    new THREE.MeshStandardMaterial({color:0xe7b93a, roughness:0.5}),
  cream:   new THREE.MeshStandardMaterial({color:0xf7ead8, roughness:0.6}),
  cakeBase:new THREE.MeshStandardMaterial({color:0xe8c76a, roughness:0.6}),
  berry:   new THREE.MeshStandardMaterial({color:0xd8352a, roughness:0.45}),
  tray:    new THREE.MeshStandardMaterial({color:0xf0b8c4, roughness:0.7}),
  terra:   new THREE.MeshStandardMaterial({color:0xa86838, roughness:0.9}),
  cactus:  new THREE.MeshStandardMaterial({color:0x4f8f3f, roughness:0.7}),
  led:     new THREE.MeshStandardMaterial({color:0x221505, emissive:0xffb45c, emissiveIntensity:2.2}),
};

const FLOOR = 1.25;

/* ---------- 工具 ---------- */
function box(parent, w,h,d, x,yBottom,z, mat, cast=true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x, yBottom+h/2, z);
  m.castShadow = cast; m.receiveShadow = true;
  parent.add(m); return m;
}
function cyl(parent, rT,rB,h, x,yBottom,z, mat, seg=14){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rT,rB,h,seg), mat);
  m.position.set(x, yBottom+h/2, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
function ball(parent, r, x,y,z, mat, sx=1,sy=1,sz=1){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r,18,14), mat);
  m.position.set(x,y,z); m.scale.set(sx,sy,sz);
  m.castShadow = true; parent.add(m); return m;
}

// 暖光光晕贴图
const glowTex = (()=>{
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,225,170,0.9)');
  gr.addColorStop(0.4,'rgba(255,190,110,0.35)');
  gr.addColorStop(1,'rgba(255,190,110,0)');
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
function glow(parent, x,y,z, scale, opacity){
  const sm = new THREE.SpriteMaterial({map:glowTex, color:0xffc46a, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false});
  const s = new THREE.Sprite(sm);
  s.position.set(x,y,z); s.scale.setScalar(scale);
  parent.add(s);
}

/* ---------- 可拆分组 ---------- */
const parts = [];
function makePart(labelText, lx,ly,lz){
  const g = new THREE.Group();
  const div = document.createElement('div');
  div.className = 'label';
  div.textContent = labelText;
  const lab = new CSS2DObject(div);
  lab.position.set(lx,ly,lz);
  g.add(lab);
  g.userData.off = new THREE.Vector3();
  g.userData.label = lab;
  scene.add(g); parts.push(g);
  return g;
}

/* ---------- 1. 波浪底座 ---------- */
const baseG = makePart('底座\n波浪底板 480×340×12', 20, 4.5, 12);
{
  const pts = [];
  for (let i=0;i<28;i++){
    const a = i/28*Math.PI*2;
    const r = 20 + 2.4*Math.sin(3*a+1.2) + 1.4*Math.sin(5*a+0.5);
    pts.push(new THREE.Vector2(Math.cos(a)*r*1.22, Math.sin(a)*r*0.8));
  }
  const sh = new THREE.Shape();
  sh.moveTo(pts[0].x, pts[0].y);
  sh.splineThru(pts.slice(1));
  const geo = new THREE.ExtrudeGeometry(sh, {depth:1.0, bevelEnabled:true, bevelThickness:0.28, bevelSize:0.28, bevelSegments:2, curveSegments:24});
  geo.rotateX(-Math.PI/2);
  const mesh = new THREE.Mesh(geo, M.ply);
  mesh.position.set(0.5, -0.05, -1.5);
  mesh.castShadow = mesh.receiveShadow = true;
  baseG.add(mesh);
}

/* ---------- 2. 下层背墙（拱门） ---------- */
const wallG = makePart('背墙\n拱门洞 160×130', -13, 16, -9);
{
  const ws = new THREE.Shape();
  ws.moveTo(-8,0); ws.lineTo(8,0); ws.lineTo(8,13); ws.lineTo(-8,13); ws.closePath();
  const arch = new THREE.Path();
  arch.moveTo(-3.9,0); arch.lineTo(-3.9,3.9);
  arch.absarc(-2.2,3.9,1.7,Math.PI,0,true);
  arch.lineTo(-0.5,0); arch.closePath();
  ws.holes.push(arch);
  const geo = new THREE.ExtrudeGeometry(ws, {depth:0.6, bevelEnabled:false, curveSegments:24});
  const wall = new THREE.Mesh(geo, M.ply);
  wall.position.set(-13, FLOOR, -10.5);
  wall.castShadow = wall.receiveShadow = true;
  wallG.add(wall);
}

/* ---------- 3. 中间展示柜（三层 + LED） ---------- */
const shelfG = makePart('展示柜\n三层·LED暖光 180×122×70', 4, 15.5, -3);
// 展示柜木作拆为独立可制作板件：底板、顶板、左右侧板、背板、两块层板
const shBottomG = makePart('展示柜·底板 01', 4, 2.2, -3);
const shTopG = makePart('展示柜·顶板 02', 4, 13.6, -3);
const shLeftG = makePart('展示柜·左侧板 03', -4.7, 7.5, -3);
const shRightG = makePart('展示柜·右侧板 04', 12.7, 7.5, -3);
const shBackG = makePart('展示柜·背板 05', 4, 7.5, -10.5);
const shShelf1G = makePart('展示柜·第一层板 06', 4, 4.9, -3);
const shShelf2G = makePart('展示柜·第二层板 07', 4, 8.7, -3);
box(shBottomG,18,0.5,7,4,FLOOR,-7,M.frame);
box(shTopG,18,0.5,7,4,12.9,-7,M.frame);
box(shLeftG,0.6,12.2,7,-4.7,FLOOR,-7,M.frame);
box(shRightG,0.6,12.2,7,12.7,FLOOR,-7,M.frame);
box(shBackG,18,12.2,0.3,4,FLOOR,-10.35,M.frame);
box(shShelf1G,16.8,0.5,6.6,4,4.6,-7,M.shelf);
box(shShelf2G,16.8,0.5,6.6,4,8.4,-7,M.shelf);
// LED 灯带
box(shelfG, 15.5,0.14,0.3, 4, 4.28, -3.75, M.led, false);
box(shelfG, 15.5,0.14,0.3, 4, 8.08, -3.75, M.led, false);
box(shelfG, 15.5,0.14,0.3, 4, 12.58, -3.75, M.led, false);
[[4,3.2,-5],[4,6.5,-5],[4,10.5,-5]].forEach(p=>{
  const l = new THREE.PointLight(0xffb050, 7, 8, 2); l.position.set(...p); shelfG.add(l);
});
glow(shelfG, 4, 4.3, -4.2, 3.5, 0.25);
glow(shelfG, 4, 8.1, -4.2, 3.5, 0.25);
glow(shelfG, 4, 12.6, -4.2, 3.5, 0.22);

/* ---------- 小鸡摆件工厂 ---------- */
function makeBird(o={}){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.95,24,18),
    new THREE.MeshStandardMaterial({color:o.body??0xf2b3c1, roughness:0.55}));
  body.scale.set(1,0.94,0.96); g.add(body);
  const eyeMat = new THREE.MeshStandardMaterial({color:0x2a2a2a, roughness:0.35});
  [-0.34,0.34].forEach(x=>{ const e = new THREE.Mesh(new THREE.SphereGeometry(0.1,10,8), eyeMat); e.position.set(x,0.28,0.78); g.add(e); });
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.1,0.24,10),
    new THREE.MeshStandardMaterial({color:0xe89830, roughness:0.5}));
  beak.rotation.x = Math.PI/2; beak.position.set(0,0.12,0.92); g.add(beak);
  const cheekMat = new THREE.MeshStandardMaterial({color:0xf2999f, roughness:0.7});
  [-0.52,0.52].forEach(x=>{ const c = new THREE.Mesh(new THREE.SphereGeometry(0.13,10,8), cheekMat); c.position.set(x,0.05,0.72); c.scale.set(1,0.7,0.5); g.add(c); });
  const footMat = new THREE.MeshStandardMaterial({color:0xe89830});
  [-0.2,0.2].forEach(x=>{ const f = new THREE.Mesh(new THREE.SphereGeometry(0.1,8,6), footMat); f.position.set(x,-0.86,0.1); f.scale.set(1,0.6,1.4); g.add(f); });
  if (o.cap){
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.88,20,12,0,Math.PI*2,0,Math.PI/2),
      new THREE.MeshStandardMaterial({color:o.cap, roughness:0.55}));
    cap.scale.set(1.02,0.55,1.0); cap.position.y = 0.5; g.add(cap);
  }
  if (o.spots){
    const sm = new THREE.MeshStandardMaterial({color:0x6a6a6a, roughness:0.6});
    [[0.42,0.3,0.6,0.3],[-0.5,-0.1,0.52,0.24],[0.1,-0.42,0.68,0.34]].forEach(s=>{
      const sp = new THREE.Mesh(new THREE.SphereGeometry(s[3],10,8), sm);
      sp.position.set(s[0],s[1],s[2]); sp.scale.set(1,0.8,0.4); g.add(sp);
    });
  }
  if (o.leaf){
    const lm = new THREE.MeshStandardMaterial({color:0x4f9f3f, roughness:0.6});
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.3,6), lm); stem.position.set(0,0.95,0); g.add(stem);
    const l1 = new THREE.Mesh(new THREE.SphereGeometry(0.16,10,8), lm); l1.position.set(0.14,1.12,0); l1.scale.set(1.5,0.5,0.8); l1.rotation.z=-0.4; g.add(l1);
    const l2 = new THREE.Mesh(new THREE.SphereGeometry(0.14,10,8), lm); l2.position.set(-0.13,1.1,0); l2.scale.set(1.3,0.5,0.8); l2.rotation.z=0.5; g.add(l2);
  }
  // 翅膀、尾羽与小爪趾，让摆件轮廓更接近手作陶偶
  const wingMat = new THREE.MeshStandardMaterial({color:o.wing ?? o.body ?? 0xf2b3c1, roughness:0.72});
  [-1,1].forEach(side=>{
    const wing = new THREE.Mesh(new THREE.SphereGeometry(0.42,14,10), wingMat);
    wing.position.set(side*0.78,-0.05,0.12); wing.scale.set(0.55,0.9,0.34);
    wing.rotation.z = side*-0.35; g.add(wing);
  });
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.25,12,8), wingMat);
  tail.position.set(0,-0.2,-0.82); tail.scale.set(0.75,0.7,1.25); g.add(tail);
  if (o.belly){
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.62,16,12),
      new THREE.MeshStandardMaterial({color:o.belly, roughness:0.65}));
    b.position.set(0,-0.15,0.42); b.scale.set(1,0.85,0.55); g.add(b);
  }
  return g;
}
function placeBird(parent, opts, x, surf, z, s=1.2, ry){
  const b = makeBird(opts);
  b.scale.setScalar(s);
  b.position.set(x, surf + 0.9*s, z);
  b.rotation.y = ry ?? (Math.random()-0.5)*0.35;
  b.traverse(m=>{ if(m.isMesh) m.castShadow = true; });
  parent.add(b); return b;
}

// 三层摆满小鸡（对照照片）
const row0 = 1.8, row1 = 5.1, row2 = 8.9;   // 站立面高度
const xs = [-2.6, 0.6, 3.8, 7.0, 10.2];
placeBird(shelfG, {body:0xcfd0a0},                              xs[0], row0, -5.0, 1.2);
placeBird(shelfG, {body:0xa9c25e, leaf:1},                      xs[1], row0, -5.0, 1.2);
placeBird(shelfG, {body:0xe6cf62},                              xs[2], row0, -5.0, 1.2);
placeBird(shelfG, {body:0xf0a8b8, belly:0xfbe0e6},              xs[3], row0, -5.0, 1.2);
placeBird(shelfG, {body:0xf2ede4, cap:0xc94a3e},                xs[4], row0, -5.0, 1.2);
placeBird(shelfG, {body:0xf2ede4, cap:0xd83a2e},                xs[0], row1, -5.0, 1.25);
placeBird(shelfG, {body:0x8a5a38, belly:0xd9b98f},              xs[1], row1, -5.0, 1.25);

/* ---------- 7. 茅草屋顶：双坡基层 + 成束顺坡叠铺 ---------- */
const roofG = makePart('茅草屋顶\n双坡骨架·分层茅草', 0, 27.5, -3);
{
  const ridgeZ = -3, ridgeY = 26.35, halfWidth = 11, slope = 0.34;
  const angle = Math.atan(slope);
  const roofLength = halfWidth / Math.cos(angle);

  // 两片连续的斜屋面基层：先遮住内部，再在其上铺设茅草
  for (const side of [-1, 1]) {
    const panel = new THREE.Mesh(new THREE.BoxGeometry(54, 0.42, roofLength),
      new THREE.MeshStandardMaterial({color:0x79512d, roughness:1}));
    panel.position.set(0, ridgeY - halfWidth*slope/2, ridgeZ + side*halfWidth/2);
    panel.rotation.x = side*angle;
    panel.castShadow = panel.receiveShadow = true;
    roofG.add(panel);
  }

  // 屋脊梁、成对椽条与顺屋檐方向的横向挂草条
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(54,0.75,0.9), M.plyDark);
  ridge.position.set(0,ridgeY+0.12,ridgeZ);
  ridge.castShadow = true; roofG.add(ridge);

  for (let x=-25; x<=25; x+=3.6) {
    for (const side of [-1,1]) {
      const rafter = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.42,roofLength+0.4), M.plyDark);
      rafter.position.set(x,ridgeY-halfWidth*slope/2,ridgeZ+side*halfWidth/2);
      rafter.rotation.x = side*angle;
      rafter.castShadow = true; roofG.add(rafter);
    }
  }
  for (const side of [-1,1]) {
    for (let d=1.1; d<10.8; d+=1.85) {
      const batten = new THREE.Mesh(new THREE.BoxGeometry(54,0.2,0.24), M.plyDark);
      batten.position.set(0,ridgeY-d*slope,ridgeZ+side*d);
      batten.rotation.x = side*angle;
      batten.castShadow = true; roofG.add(batten);
    }
    const fascia = new THREE.Mesh(new THREE.BoxGeometry(54,0.55,0.42), M.plyDark);
    fascia.position.set(0,ridgeY-halfWidth*slope-0.05,ridgeZ+side*(halfWidth+0.12));
    fascia.rotation.x = side*angle;
    fascia.castShadow = true; roofG.add(fascia);
  }

  // 茅草不再随机竖插：每根草茎沿屋面坡向排列，按行错缝叠压。
  // 每束由多根近乎平行的细茎组成，束与束之间留有轻微自然起伏。
  const capacity = 6600;
  const stemGeo = new THREE.CylinderGeometry(0.022,0.032,1,5);
  const stems = new THREE.InstancedMesh(stemGeo,
    new THREE.MeshStandardMaterial({color:0xd0aa62, roughness:1}), capacity);
  const dummy = new THREE.Object3D();
  const tint = new THREE.Color();
  const downSlope = new THREE.Vector3(0,-Math.sin(angle),0);
  let count = 0;
  for (const side of [-1,1]) {
    const direction = new THREE.Vector3(0,-Math.sin(angle),side*Math.cos(angle)).normalize();
    const orient = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),direction);
    for (let row=0; row<6; row++) {
      const distance = 1.0 + row*1.78;
      const stagger = row%2 ? 0.48 : 0;
      for (let bundle=-22; bundle<=22; bundle++) {
        const bundleX = bundle*1.18 + stagger;
        const strands = 11 + (bundle%3===0 ? 3 : 0);
        for (let k=0; k<strands; k++) {
          if (count>=capacity) break;
          const x = bundleX + (Math.random()-0.5)*0.62;
          const along = (Math.random()-0.5)*0.72;
          const d = distance + along;
          const length = 3.65 + Math.random()*0.42;
          const centerD = d + length*0.12;
          dummy.position.set(
            x,
            ridgeY - centerD*slope + 0.12 + Math.random()*0.12,
            ridgeZ + side*centerD
          );
          dummy.quaternion.copy(orient);
          dummy.rotateY((Math.random()-0.5)*0.035);
          dummy.rotateZ((Math.random()-0.5)*0.045);
          dummy.scale.set(0.82+Math.random()*0.28,length,0.82+Math.random()*0.25);
          dummy.updateMatrix();
          stems.setMatrixAt(count,dummy.matrix);
          tint.setHSL(0.105+Math.random()*0.018,0.42+Math.random()*0.12,0.43+Math.random()*0.13);
          stems.setColorAt(count,tint);
          count++;
        }
      }
    }
  }
  stems.count = count;
  stems.castShadow = stems.receiveShadow = true;
  stems.instanceMatrix.needsUpdate = true;
  if (stems.instanceColor) stems.instanceColor.needsUpdate = true;
  roofG.add(stems);

  // 屋脊压草帽：用一排短束盖住两坡交接线，避免露出尖锐梁角
  const cap = new THREE.Mesh(new THREE.BoxGeometry(54,0.48,1.25),
    new THREE.MeshStandardMaterial({color:0xb58a4c, roughness:1}));
  cap.position.set(0,ridgeY+0.34,ridgeZ);
  cap.castShadow = true; roofG.add(cap);
}

function makeLadder(len){
  const g = new THREE.Group();
  [-0.9,0.9].forEach(x=>{
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.4,len,0.4), M.plyDark);
    rail.position.x = x; rail.castShadow = rail.receiveShadow = true; g.add(rail);

  for (let i=1;i<=n;i++){
    const rung = new THREE.Mesh(new THREE.BoxGeometry(2.0,0.3,0.35), M.plyDark);
    rung.position.y = -len/2 + i*(len/(n+1));
    rung.castShadow = rung.receiveShadow = true;
    g.add(rung);
  }
  return g;
}

{name:'展示柜右侧板',size:'约 122×70×6 mm（模型估算）',material:'1.5–2 mm 木板',tool:'钢尺、细锯、直角尺',method:'与左侧板同尺寸裁切，标记相同层板高度后粘接。',check:'左右板平行，柜体开口宽度一致。'},
{name:'展示柜背板',size:'约 180×122×3 mm（模型估算）',material:'1–1.5 mm 薄夹板/椴木板',tool:'细锯、砂纸、木工胶',method:'柜体框架校方后测量净口裁切，背板从后侧定位粘接。',check:'背板用于锁定方正度，粘接前复核对角线。'},
{name:'展示柜第一层板',size:'约 168×66×5 mm（模型估算）',material:'1.5 mm 木板',tool:'钢尺、细锯、砂纸',method:'按柜内净宽裁切，标高定位后两侧点胶固定。',check:'层板前后边缘平行，安装后检查水平。'},
{name:'展示柜第二层板',size:'约 168×66×5 mm（模型估算）',material:'1.5 mm 木板',tool:'钢尺、细锯、砂纸',method:'按第一层板相同尺寸裁切，使用同一高度基准治具定位。',check:'与第一层板间距一致，避免影响陈列物高度。'}
];
const craftSteps=[
['底板与定位','材料：3–5 mm 椴木板/桦木夹板，底板约 480×340 mm。画中心线、墙体和柜体定位线，再切外轮廓。','在平整玻璃面检查底板翘曲。'],
['墙体与拱门','按纸样切背墙和拱门内孔；干装校正垂直后再用直角夹粘接。','先不封顶，方便安装柜体和布线。'],
['展示柜与侧柜','拼柜体框架，再按基准线安装层板；预留 LED 灯带和走线孔。','用纸板样件检查玩偶净高和层间距。'],
['阁楼承托与楼板','先加托梁，再安装楼板；检查水平与承托点。','大跨度薄板需托梁，防止下垂。'],
['阁楼小屋与心形窗','切窗洞并打磨，组装墙体，最后粘窗框和窗台。','先钻孔再切曲线，避免木片开裂。'],
['屋顶骨架与茅草','先做屋脊梁和椽条，再由檐口向上分层铺茅草。','先做小样测试纤维密度、胶水和干燥效果。'],
['楼梯、家具与摆件','梯子先组装后定位；桌椅和玩偶分开制作、上色、干摆。','摆件最后固定，保留取放和维修空间。'],
['灯光测试与收尾','测试 LED 与电池盒，再遮蔽导线、补漆、清理胶痕并安装装饰。','确认电池可更换，导线不被结构压住。']
];
let activeCraftStep=0;
function renderCraftStep(){const q=craftSteps[activeCraftStep];document.getElementById('guideTitle').textContent='第 '+(activeCraftStep+1)+' 步 · '+q[0];document.getElementById('guideBody').textContent=q[1]+'\n注意：'+q[2];}
document.getElementById('prevStep').onclick=()=>{activeCraftStep=Math.max(0,activeCraftStep-1);renderCraftStep();};
document.getElementById('nextStep').onclick=()=>{activeCraftStep=Math.min(craftSteps.length-1,activeCraftStep+1);renderCraftStep();};
document.getElementById('showSelected').onclick=renderCraftStep;
renderCraftStep();

/* ---------- 结构目录与部件聚焦 ---------- */
const partList = document.getElementById('partList');
const partNames = ['波浪底座','拱门背墙','三层展示柜摆件/灯光','右侧高柜','阁楼楼板','阁楼小屋','茅草屋顶','双木梯与圆台','软装与家具','展示柜底板','展示柜顶板','展示柜左侧板','展示柜右侧板','展示柜背板','展示柜第一层板','展示柜第二层板'];
parts.forEach((part,i)=>{
  const btn=document.createElement('button');
  btn.className='part-btn';
  btn.innerHTML='<span>'+partNames[i]+'</span><small>0'+(i+1)+'</small>';
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.part-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const info=craftInfo[i];
    document.getElementById('guideTitle').textContent=info.name+' · 零件制作卡';
    document.getElementById('guideBody').textContent='参考尺寸：'+info.size+'\n材料：'+info.material+'\n工具：'+info.tool+'\n制作：'+info.method+'\n检查：'+info.check;
    const world=new THREE.Vector3(); part.getWorldPosition(world);
    controls.target.copy(world);
    camera.position.copy(world.clone().add(new THREE.Vector3(30,20,34)));
  });
  partList.appendChild(btn);
});

/* ---------- 拆分偏移 ---------- */
baseG.userData.off.set(0, 0, 0);
wallG.userData.off.set(-9, 1, -3);
shelfG.userData.off.set(0, 0, 8);
cabG.userData.off.set(10, 2, 2);
loftG.userData.off.set(2, 7, 3);
atticG.userData.off.set(-3, 14, 1);
roofG.userData.off.set(0, 22, 0);
ladderG.userData.off.set(-12, 0, 7);
furnG.userData.off.set(5, 0, 10);
shBottomG.userData.off.set(0,-4,0);
shTopG.userData.off.set(0,5,0);
shLeftG.userData.off.set(-5,0,0);
shRightG.userData.off.set(5,0,0);
shBackG.userData.off.set(0,0,-5);
shShelf1G.userData.off.set(0,0,5);
shShelf2G.userData.off.set(0,0,8);

/* ---------- 地面 ---------- */
const ground = new THREE.Mesh(new THREE.CircleGeometry(140,48),
  new THREE.MeshStandardMaterial({color:0xefe6d8, roughness:1}));
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- 交互 ---------- */
let labelsVisible = true;
const msg = document.getElementById('msg');
const slider = document.getElementById('explode');
function updateExplode(t){
  const e = t*t*(3-2*t);   // smoothstep 缓动，滑杆拖动更顺滑
  parts.forEach(p => p.position.copy(p.userData.off).multiplyScalar(e));
  msg.textContent = t < 0.01 ? '当前：完整组装' : `当前：结构拆分 ${Math.round(t*100)}%`;
}
slider.oninput = () => updateExplode(parseFloat(slider.value));
document.getElementById('reset').onclick = () => {
  slider.value = 0;
  updateExplode(0);
};
document.getElementById('hideLabels').onclick = () => {
  labelsVisible = !labelsVisible;
  parts.forEach(p => { if (p.userData.label) p.userData.label.visible = labelsVisible; });
};

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();

window.onresize = () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
};
</script>
</body>
</html>
